<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Розсилка · Smart Kasa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #e8eef2;
      --bg1: #f4f7f9;
      --ink: #14212b;
      --ink-soft: #3d4f5c;
      --muted: #6b7c88;
      --line: rgba(20, 33, 43, 0.1);
      --panel: rgba(255, 255, 255, 0.78);
      --panel-solid: #ffffff;
      --accent: #0b7a75;
      --accent-deep: #065f5b;
      --accent-glow: rgba(11, 122, 117, 0.18);
      --sent: #1a7a4c;
      --sent-bg: #e6f5ed;
      --failed: #b42318;
      --failed-bg: #fdecea;
      --pending: #9a6700;
      --pending-bg: #fff6df;
      --skipped: #5c6b75;
      --skipped-bg: #eef1f3;
      --shadow: 0 18px 50px rgba(20, 33, 43, 0.1);
      --radius: 18px;
      --font: "Figtree", system-ui, sans-serif;
      --display: "Syne", "Figtree", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 12% -10%, rgba(11, 122, 117, 0.16), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(20, 33, 43, 0.08), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 45%, #edf3f6);
      min-height: 100%;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent-deep); }

    .hidden { display: none !important; }

    /* —— Login —— */
    #view-login {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      animation: rise 0.55s ease both;
    }
    .login-shell {
      width: min(420px, 100%);
      padding: 40px 36px 34px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 6px);
      box-shadow: var(--shadow);
    }
    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 10px;
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: block;
    }
    .brand {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(1.85rem, 4.5vw, 2.25rem);
      letter-spacing: -0.03em;
      line-height: 1;
      margin: 0;
      color: #1b2b4a;
      text-transform: uppercase;
    }
    .brand span { color: #2daaff; }
    .lede {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.45;
    }
    .field { display: grid; gap: 7px; margin-bottom: 14px; }
    .field-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .field-head label { margin: 0; }
    .field label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-icon {
      width: 36px;
      height: 36px;
      min-height: 36px;
      padding: 0;
      border-radius: 999px;
      font-family: var(--display);
      font-weight: 800;
      font-size: 0.95rem;
      line-height: 1;
    }
    .file-chip {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(11, 122, 117, 0.28);
      background: linear-gradient(135deg, rgba(11, 122, 117, 0.1), rgba(45, 170, 255, 0.08));
    }
    .file-chip-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--panel-solid);
      color: var(--accent-deep);
      font-weight: 800;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      flex-shrink: 0;
      border: 1px solid var(--line);
    }
    .file-chip-body { flex: 1; min-width: 0; }
    .file-chip-name {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-chip-meta { color: var(--muted); font-size: 0.86rem; margin-top: 2px; }
    .file-chip-remove {
      width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      border-radius: 999px;
      font-size: 1.1rem;
      line-height: 1;
      flex-shrink: 0;
    }

    /* Universal modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(20, 33, 43, 0.42);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal {
      position: fixed;
      z-index: 61;
      left: 50%;
      top: 50%;
      width: min(440px, calc(100vw - 32px));
      max-height: min(80vh, 560px);
      transform: translate(-50%, -46%) scale(0.96);
      opacity: 0;
      pointer-events: none;
      background: var(--panel-solid);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr;
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 20px 12px;
      border-bottom: 1px solid var(--line);
    }
    .modal-head h3 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }
    .modal-body {
      overflow: auto;
      padding: 16px 20px 22px;
      color: var(--ink-soft);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .modal-body ul {
      margin: 10px 0 0;
      padding-left: 1.15em;
    }
    .modal-body li { margin: 6px 0; }
    .modal-body strong { color: var(--ink); }
    .campaign-members {
      display: grid;
      gap: 8px;
      margin-top: 4px;
    }
    .campaign-member {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--line);
      font-size: 0.9rem;
    }
    .field input, .field select, .field textarea,
    .filters input, .filters select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-solid);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field textarea { min-height: 140px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus,
    .filters input:focus, .filters select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 11px 18px;
      font-weight: 600;
      line-height: 1.25;
      min-height: 44px;
      transition: transform 0.12s, background 0.15s, opacity 0.15s, border-color 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      width: 100%;
      margin-top: 8px;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-deep);
      border-color: var(--accent-deep);
    }
    .btn-ghost {
      background: var(--panel-solid);
      color: var(--ink-soft);
      border-color: var(--line);
    }
    .btn-ghost:hover { background: rgba(20, 33, 43, 0.04); }
    .btn-soft {
      background: var(--accent-glow);
      border-color: transparent;
      color: var(--accent-deep);
    }
    .btn-soft:hover { background: rgba(11, 122, 117, 0.28); }
    .btn-sm {
      padding: 8px 14px;
      font-size: 0.88rem;
      border-radius: 10px;
      min-height: 40px;
    }
    .filter-actions {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .filter-actions .btn {
      width: auto;
      margin-top: 0;
      flex: 1 1 auto;
    }
    .err {
      margin-top: 12px;
      color: var(--failed);
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    /* —— App shell —— */
    #view-app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      animation: rise 0.45s ease both;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px clamp(16px, 4vw, 40px);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar .brand-lockup { margin: 0; gap: 10px; }
    .topbar .brand-logo { width: 34px; height: 34px; }
    .topbar .brand { font-size: 1.2rem; }
    .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .tabs {
      display: inline-flex;
      padding: 4px;
      background: rgba(20, 33, 43, 0.06);
      border-radius: 14px;
      gap: 2px;
    }
    .tab {
      border: none;
      background: transparent;
      padding: 9px 16px;
      border-radius: 11px;
      font-weight: 600;
      color: var(--muted);
      transition: background 0.18s, color 0.18s, transform 0.18s;
    }
    .tab.active {
      background: var(--panel-solid);
      color: var(--ink);
      box-shadow: 0 4px 14px rgba(20, 33, 43, 0.08);
    }
    .main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 28px clamp(16px, 4vw, 40px) 48px;
    }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 10px 36px rgba(20, 33, 43, 0.06);
      overflow: hidden;
    }
    .panel-head {
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h2 {
      margin: 0 0 4px;
      font-family: var(--display);
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }
    .panel-head p { margin: 0; color: var(--muted); font-size: 0.92rem; }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, 1fr) auto;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.4);
    }
    @media (max-width: 820px) {
      .filters { grid-template-columns: 1fr 1fr; }
      .filters .filter-actions { grid-column: 1 / -1; }
    }

    .list { list-style: none; margin: 0; padding: 0; }
    .row {
      border-bottom: 1px solid var(--line);
      transition: background 0.15s;
    }
    .row:last-child { border-bottom: none; }
    .row-main {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 20px;
      border: none;
      background: transparent;
      text-align: left;
    }
    .row-main:hover { background: rgba(11, 122, 117, 0.04); }
    .row.open .row-main { background: rgba(11, 122, 117, 0.06); }
    .row-title {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 14px;
    }
    .phone {
      font-weight: 700;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .meta {
      color: var(--muted);
      font-size: 0.86rem;
    }
    .row-sub {
      margin-top: 4px;
      color: var(--ink-soft);
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 52ch;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    .badge-sent { color: var(--sent); background: var(--sent-bg); }
    .badge-failed { color: var(--failed); background: var(--failed-bg); }
    .badge-pending { color: var(--pending); background: var(--pending-bg); }
    .badge-skipped { color: var(--skipped); background: var(--skipped-bg); }

    .detail {
      display: none;
      padding: 0 20px 16px;
      animation: expand 0.22s ease both;
    }
    .row.open .detail { display: block; }
    .detail-grid {
      display: grid;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(20, 33, 43, 0.035);
      border: 1px solid var(--line);
    }
    .detail-grid pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--font);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .kv { display: grid; gap: 2px; }
    .kv span { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
    }
    .empty, .loading {
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
    }

    .send-wrap { padding: 22px 20px 24px; max-width: 520px; }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 50;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      box-shadow: var(--shadow);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      max-width: min(360px, calc(100vw - 40px));
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.ok { background: var(--sent); }
    .toast.bad { background: var(--failed); }

    /* Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 33, 43, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 40;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: min(440px, 100%);
      background: var(--panel-solid);
      box-shadow: -12px 0 40px rgba(20, 33, 43, 0.18);
      transform: translateX(104%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 41;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .drawer-head h3 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }
    .drawer-body { overflow: auto; padding: 8px 0 24px; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes expand {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="view-login">
    <div class="login-shell">
      <div class="brand-lockup">
        <img class="brand-logo" src="/assets/logo-background.svg" alt="Smart Kasa" width="48" height="48" />
        <h1 class="brand">Роз<span>силка</span></h1>
      </div>
      <p class="lede">Адмінка розсилок: історія, фільтри й ручна відправка.</p>
      <form id="login-form">
        <div class="field">
          <label for="login-username">Логін</label>
          <input id="login-username" name="username" autocomplete="username" required placeholder="operator" />
        </div>
        <div class="field">
          <label for="login-password">Пароль</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="8" />
        </div>
        <button class="btn btn-primary" type="submit" id="login-btn">Увійти</button>
        <div class="err" id="login-err"></div>
      </form>
    </div>
  </div>

  <div id="view-app" class="hidden">
    <header class="topbar">
      <div class="brand-lockup">
        <img class="brand-logo" src="/assets/logo-background.svg" alt="Smart Kasa" width="34" height="34" />
        <h1 class="brand">Роз<span>силка</span></h1>
      </div>
      <div class="top-actions">
        <nav class="tabs" role="tablist">
          <button type="button" class="tab active" data-tab="history" id="tab-history">Історія</button>
          <button type="button" class="tab" data-tab="send" id="tab-send">Надіслати</button>
        </nav>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-logout">Вийти</button>
      </div>
    </header>

    <main class="main">
      <section id="panel-history" class="panel">
        <div class="panel-head">
          <h2>Останні сповіщення</h2>
          <p>Розгорни рядок · історія по номеру · написати користувачу</p>
        </div>
        <div class="filters">
          <select id="f-status" aria-label="Статус">
            <option value="">Усі статуси</option>
            <option value="sent">Надіслано</option>
            <option value="failed">Помилка</option>
            <option value="pending">В очікуванні</option>
            <option value="skipped">Пропущено</option>
          </select>
          <input id="f-phone" type="text" placeholder="Телефон" aria-label="Телефон" />
          <input id="f-date" type="date" aria-label="Дата" />
          <select id="f-hour" aria-label="Година">
            <option value="">Година</option>
          </select>
          <div class="filter-actions">
            <button type="button" class="btn btn-primary btn-sm" id="btn-filter">Знайти</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-filter-reset">Скинути</button>
          </div>
        </div>
        <div id="list-host">
          <div class="loading">Завантаження…</div>
        </div>
        <div class="pager">
          <span id="pager-info">—</span>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn btn-ghost btn-sm" id="btn-prev" disabled>Назад</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-next" disabled>Далі</button>
          </div>
        </div>
      </section>

      <section id="panel-send" class="panel hidden">
        <div class="panel-head">
          <h2>Надіслати повідомлення</h2>
          <p>MyChatbot Trigger Outreach · запис у notifications</p>
        </div>
        <form class="send-wrap" id="send-form">
          <div class="field">
            <div class="field-head">
              <label for="send-phone">Телефон</label>
              <div class="field-actions">
                <button type="button" class="btn btn-ghost btn-sm btn-icon" id="btn-import-help" title="Як імпортувати" aria-label="Довідка імпорту">i</button>
                <button type="button" class="btn btn-ghost btn-sm" id="btn-import">Імпортувати файл</button>
                <input type="file" id="send-file" accept=".csv,.xlsx,.txt,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
              </div>
            </div>
            <input id="send-phone" placeholder="+380XXXXXXXXX" />
            <div id="file-chip" class="file-chip hidden" aria-live="polite">
              <div class="file-chip-icon" id="file-chip-ext">CSV</div>
              <div class="file-chip-body">
                <div class="file-chip-name" id="file-chip-name">—</div>
                <div class="file-chip-meta" id="file-chip-meta">—</div>
              </div>
              <button type="button" class="btn btn-ghost file-chip-remove" id="btn-file-clear" title="Прибрати файл" aria-label="Прибрати файл">×</button>
            </div>
          </div>
          <div class="field">
            <label for="send-text">Текст</label>
            <textarea id="send-text" required maxlength="4000" placeholder="Текст повідомлення"></textarea>
          </div>
          <button class="btn btn-primary" type="submit" id="send-btn">Надіслати</button>
          <div class="err" id="send-err"></div>
          <div id="send-result" class="hidden" style="margin-top:16px"></div>
        </form>
      </section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <h3 id="drawer-title">Історія номера</h3>
        <p class="meta" id="drawer-sub" style="margin:6px 0 0"></p>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="drawer-close">Закрити</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal-head">
      <h3 id="modal-title">—</h3>
      <button type="button" class="btn btn-ghost btn-sm btn-icon" id="modal-close" aria-label="Закрити">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>

  <script>
    (() => {
      const API = "/api/v1";
      const TOKEN_KEY = "ms_admin_jwt";
      const NAME_KEY = "ms_admin_name";

      const $ = (id) => document.getElementById(id);
      const viewLogin = $("view-login");
      const viewApp = $("view-app");
      const listHost = $("list-host");
      const toastEl = $("toast");
      const drawer = $("drawer");
      const drawerBackdrop = $("drawer-backdrop");

      const hourSelect = $("f-hour");
      for (let h = 0; h < 24; h++) {
        const opt = document.createElement("option");
        opt.value = String(h);
        opt.textContent = `${String(h).padStart(2, "0")}:00`;
        hourSelect.appendChild(opt);
      }

      const state = {
        page: 1,
        count: 0,
        pageSize: 20,
        expandedId: null,
        filters: {},
        bulkFile: null,
        bulkTotal: null,
      };

      const STATUS = {
        sent: { label: "Надіслано", cls: "badge-sent" },
        failed: { label: "Помилка", cls: "badge-failed" },
        pending: { label: "В очікуванні", cls: "badge-pending" },
        skipped: { label: "Пропущено", cls: "badge-skipped" },
      };

      function token() {
        return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || "";
      }

      function setAuth(accessToken, name) {
        localStorage.setItem(TOKEN_KEY, accessToken);
        if (name) localStorage.setItem(NAME_KEY, name);
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(NAME_KEY);
      }

      function clearAuth() {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(NAME_KEY);
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(NAME_KEY);
      }

      class AuthError extends Error {
        constructor(message) {
          super(message || "Сесія закінчилась");
          this.name = "AuthError";
        }
      }

      function readJwtPayload(tok) {
        try {
          const part = tok.split(".")[1];
          if (!part) return null;
          const b64 = part.replace(/-/g, "+").replace(/_/g, "/");
          const json = decodeURIComponent(
            atob(b64).split("").map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join("")
          );
          return JSON.parse(json);
        } catch {
          return null;
        }
      }

      function isTokenUnusable(tok) {
        if (!tok || !String(tok).trim()) return true;
        const payload = readJwtPayload(tok);
        if (!payload) return true;
        if (payload.exp != null && Date.now() >= Number(payload.exp) * 1000 - 3000) return true;
        return false;
      }

      function authDetailMessage(data) {
        const d = data?.detail ?? data;
        if (typeof d === "string") return d;
        if (Array.isArray(d)) return d.map(String).join("; ");
        if (d && typeof d === "object") {
          if (typeof d.detail === "string") return d.detail;
          try { return JSON.stringify(d); } catch { return ""; }
        }
        return "";
      }

      function isAuthFailure(status, detailMsg) {
        if (status === 401) return true;
        const m = String(detailMsg || "").toLowerCase();
        if (!m) return status === 403;
        return (
          m.includes("token expired") ||
          m.includes("invalid token") ||
          m.includes("invalid authorization") ||
          m.includes("user not found") ||
          m.includes("client not found") ||
          m.includes("authentication credentials") ||
          m.includes("not authenticated")
        );
      }

      function forceLogout(reason) {
        clearAuth();
        closeModal();
        closeDrawer();
        showApp(false);
        if (reason) showToast(reason, "bad");
      }

      function requireValidSession() {
        const t = token();
        if (isTokenUnusable(t)) {
          forceLogout("Сесія закінчилась. Увійдіть знову.");
          throw new AuthError("Сесія закінчилась. Увійдіть знову.");
        }
        return t;
      }

      function showToast(msg, kind) {
        toastEl.textContent = msg;
        toastEl.className = "toast show" + (kind ? ` ${kind}` : "");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toastEl.classList.remove("show"), 3200);
      }

      const modalEl = $("modal");
      const modalBackdrop = $("modal-backdrop");

      function openModal({ title, bodyHtml }) {
        $("modal-title").textContent = title || "";
        $("modal-body").innerHTML = bodyHtml || "";
        modalEl.classList.add("open");
        modalBackdrop.classList.add("open");
        modalEl.setAttribute("aria-hidden", "false");
      }

      function closeModal() {
        modalEl.classList.remove("open");
        modalBackdrop.classList.remove("open");
        modalEl.setAttribute("aria-hidden", "true");
      }

      $("modal-close").addEventListener("click", closeModal);
      modalBackdrop.addEventListener("click", closeModal);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modalEl.classList.contains("open")) closeModal();
      });

      function badgeHtml(status) {
        const s = STATUS[status] || { label: status || "—", cls: "badge-skipped" };
        return `<span class="badge ${s.cls}">${esc(s.label)}</span>`;
      }

      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function fmtTime(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return esc(iso);
        return d.toLocaleString("uk-UA", {
          day: "2-digit", month: "2-digit", year: "numeric",
          hour: "2-digit", minute: "2-digit",
        });
      }

      function previewText(n) {
        const t = n?.payload?.text || n?.payload?.context || "";
        if (t) return t;
        if (n?.error) return n.error;
        return n?.message_type || "";
      }

      async function api(path, options = {}) {
        const headers = Object.assign({ Accept: "application/json" }, options.headers || {});
        const isForm = typeof FormData !== "undefined" && options.body instanceof FormData;
        if (options.body && !isForm && !headers["Content-Type"]) {
          headers["Content-Type"] = "application/json";
        }
        const skipAuth = Boolean(options.skipAuth);
        if (!skipAuth) {
          const t = requireValidSession();
          headers.Authorization = `Bearer ${t}`;
        }
        const res = await fetch(API + path, { ...options, headers });
        let data = null;
        const raw = await res.text();
        try { data = raw ? JSON.parse(raw) : null; } catch { data = { detail: raw }; }
        if (!res.ok) {
          const detail = authDetailMessage(data) || data?.phone || data?.status || data?.non_field_errors;
          const msg = typeof detail === "string"
            ? detail
            : (detail ? JSON.stringify(detail) : `HTTP ${res.status}`);
          if (!skipAuth && isAuthFailure(res.status, msg)) {
            forceLogout("Сесія закінчилась. Увійдіть знову.");
            throw new AuthError("Сесія закінчилась. Увійдіть знову.");
          }
          throw new Error(msg);
        }
        return data;
      }

      function campaignIdOf(n) {
        return n?.payload?.campaign_id || null;
      }

      function groupFeed(items) {
        const out = [];
        const seen = new Set();
        for (const n of items) {
          const cid = campaignIdOf(n);
          if (!cid) {
            out.push({ kind: "single", item: n });
            continue;
          }
          if (seen.has(cid)) continue;
          seen.add(cid);
          out.push({
            kind: "campaign",
            campaignId: cid,
            item: n,
            countOnPage: items.filter((x) => campaignIdOf(x) === cid).length,
          });
        }
        return out;
      }

      function showApp(on) {
        viewLogin.classList.toggle("hidden", on);
        viewApp.classList.toggle("hidden", !on);
        if (on) {
          if (isTokenUnusable(token())) {
            forceLogout("Сесія закінчилась. Увійдіть знову.");
            return;
          }
          switchTab("history");
          loadList();
        } else {
          $("login-err").textContent = "";
        }
      }

      function switchTab(name) {
        document.querySelectorAll(".tab").forEach((el) => {
          el.classList.toggle("active", el.dataset.tab === name);
        });
        $("panel-history").classList.toggle("hidden", name !== "history");
        $("panel-send").classList.toggle("hidden", name !== "send");
      }

      function goSend(phone) {
        switchTab("send");
        if (phone) $("send-phone").value = phone;
        $("send-text").focus();
      }

      function collectFilters() {
        const status = $("f-status").value.trim();
        const phone = $("f-phone").value.trim();
        const date = $("f-date").value.trim();
        const hour = $("f-hour").value.trim();
        const f = {};
        if (status) f.status = status;
        if (phone) f.phone = phone;
        if (date) f.date = date;
        if (hour !== "" && date) f.hour = hour;
        return f;
      }

      function qs(params) {
        const u = new URLSearchParams();
        Object.entries(params).forEach(([k, v]) => {
          if (v !== undefined && v !== null && v !== "") u.set(k, v);
        });
        const s = u.toString();
        return s ? `?${s}` : "";
      }

      async function loadList() {
        listHost.innerHTML = `<div class="loading">Завантаження…</div>`;
        try {
          const data = await api(`/notifications${qs({ ...state.filters, page: state.page })}`);
          const results = data.results || data || [];
          state.count = data.count ?? results.length;
          state.pageSize = 20;
          renderList(results);
          const pages = Math.max(1, Math.ceil(state.count / state.pageSize));
          $("pager-info").textContent = state.count
            ? `Стор. ${state.page} з ${pages} · ${state.count} записів`
            : "Немає записів";
          $("btn-prev").disabled = state.page <= 1;
          $("btn-next").disabled = state.page >= pages || !data.next;
        } catch (e) {
          if (e instanceof AuthError || e?.name === "AuthError") {
            listHost.innerHTML = "";
            $("pager-info").textContent = "—";
            return;
          }
          listHost.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
          $("pager-info").textContent = "—";
        }
      }

      function renderList(items) {
        if (!items.length) {
          listHost.innerHTML = `<div class="empty">Нічого не знайдено</div>`;
          return;
        }
        const groups = groupFeed(items);
        listHost.innerHTML = `<ul class="list">${groups.map((g) =>
          g.kind === "campaign" ? campaignRowHtml(g) : rowHtml(g.item)
        ).join("")}</ul>`;
        listHost.querySelectorAll("[data-expand]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const row = btn.closest(".row");
            if (row?.dataset.campaignId) toggleCampaignExpand(row);
            else toggleExpand(row);
          });
        });
        listHost.querySelectorAll("[data-by-phone]").forEach((btn) => {
          btn.addEventListener("click", (ev) => {
            ev.stopPropagation();
            openPhoneDrawer(btn.dataset.byPhone);
          });
        });
        listHost.querySelectorAll("[data-write]").forEach((btn) => {
          btn.addEventListener("click", (ev) => {
            ev.stopPropagation();
            goSend(btn.dataset.write);
          });
        });
        if (state.expandedId) {
          const row = listHost.querySelector(`[data-id="${CSS.escape(state.expandedId)}"]`);
          if (row) {
            row.classList.add("open");
            if (row.dataset.campaignId) loadCampaignMembers(row);
          }
        }
      }

      function rowHtml(n) {
        const open = state.expandedId === n.id ? " open" : "";
        return `
          <li class="row${open}" data-id="${esc(n.id)}">
            <button type="button" class="row-main" data-expand>
              <div>
                <div class="row-title">
                  <span class="phone">${esc(n.phone)}</span>
                  <span class="meta">${esc(n.message_type || "")} · ${fmtTime(n.created_at)}</span>
                </div>
                <div class="row-sub">${esc(previewText(n))}</div>
              </div>
              ${badgeHtml(n.status)}
            </button>
            <div class="detail">
              <div class="detail-grid">
                <div class="kv"><span>Текст</span><pre>${esc(previewText(n) || "—")}</pre></div>
                ${n.error ? `<div class="kv"><span>Помилка</span><pre>${esc(n.error)}</pre></div>` : ""}
                <div class="kv"><span>Надіслано</span><div>${fmtTime(n.sent_at)}</div></div>
                <div class="kv"><span>ID</span><div class="meta">${esc(n.id)}</div></div>
                <div class="actions">
                  <button type="button" class="btn btn-soft btn-sm" data-by-phone="${esc(n.phone)}">Усі по цьому номеру</button>
                  <button type="button" class="btn btn-primary btn-sm" style="width:auto" data-write="${esc(n.phone)}">Написати</button>
                </div>
              </div>
            </div>
          </li>`;
      }

      function campaignRowHtml(g) {
        const n = g.item;
        const id = `campaign:${g.campaignId}`;
        const open = state.expandedId === id ? " open" : "";
        return `
          <li class="row${open}" data-id="${esc(id)}" data-campaign-id="${esc(g.campaignId)}">
            <button type="button" class="row-main" data-expand>
              <div>
                <div class="row-title">
                  <span class="phone">Групова розсилка</span>
                  <span class="meta">${fmtTime(n.created_at)}</span>
                </div>
                <div class="row-sub">${esc(previewText(n))}</div>
              </div>
              <span class="badge badge-pending">Сесія</span>
            </button>
            <div class="detail">
              <div class="detail-grid">
                <div class="kv"><span>Текст</span><pre>${esc(previewText(n) || "—")}</pre></div>
                <div class="kv"><span>Campaign</span><div class="meta">${esc(g.campaignId)}</div></div>
                <div class="campaign-members" data-host></div>
              </div>
            </div>
          </li>`;
      }

      function toggleExpand(row) {
        if (!row) return;
        const id = row.dataset.id;
        const was = row.classList.contains("open");
        listHost.querySelectorAll(".row.open").forEach((r) => r.classList.remove("open"));
        if (!was) {
          row.classList.add("open");
          state.expandedId = id;
        } else {
          state.expandedId = null;
        }
      }

      async function toggleCampaignExpand(row) {
        if (!row) return;
        const id = row.dataset.id;
        const was = row.classList.contains("open");
        listHost.querySelectorAll(".row.open").forEach((r) => r.classList.remove("open"));
        if (was) {
          state.expandedId = null;
          return;
        }
        row.classList.add("open");
        state.expandedId = id;
        await loadCampaignMembers(row);
      }

      async function loadCampaignMembers(row) {
        const host = row.querySelector("[data-host]");
        const cid = row.dataset.campaignId;
        if (!host || !cid || host.dataset.loaded === "1") return;
        host.innerHTML = `<div class="loading">Завантаження номерів…</div>`;
        try {
          const data = await api(`/notifications${qs({ campaign_id: cid })}`);
          const results = Array.isArray(data) ? data : (data.results || []);
          if (!results.length) {
            host.innerHTML = `<div class="empty">Порожньо</div>`;
            return;
          }
          host.innerHTML = results.map((n) => `
            <div class="campaign-member">
              <div>
                <div class="phone">${esc(n.phone)}</div>
                ${n.error ? `<div class="meta" style="color:var(--failed)">${esc(n.error)}</div>` : ""}
              </div>
              ${badgeHtml(n.status)}
            </div>`).join("");
          host.dataset.loaded = "1";
          const title = row.querySelector(".row-title .phone");
          if (title) title.textContent = `Групова розсилка · ${results.length}`;
        } catch (e) {
          if (e instanceof AuthError || e?.name === "AuthError") return;
          host.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
        }
      }

      async function openPhoneDrawer(phone) {
        drawer.classList.add("open");
        drawerBackdrop.classList.add("open");
        drawer.setAttribute("aria-hidden", "false");
        $("drawer-title").textContent = phone;
        $("drawer-sub").textContent = "Усі розсилки на цей номер";
        $("drawer-body").innerHTML = `<div class="loading">Завантаження…</div>`;
        try {
          const encoded = encodeURIComponent(phone);
          const data = await api(`/notifications/by-phone/${encoded}${qs({ page: 1 })}`);
          const results = data.results || [];
          if (!results.length) {
            $("drawer-body").innerHTML = `<div class="empty">Немає записів</div>`;
            return;
          }
          $("drawer-body").innerHTML = `
            <div style="padding:8px 20px 0;display:flex;justify-content:flex-end">
              <button type="button" class="btn btn-primary btn-sm" style="width:auto" id="drawer-write">Написати</button>
            </div>
            <ul class="list">${results.map((n) => `
              <li class="row">
                <div class="row-main" style="cursor:default">
                  <div>
                    <div class="row-title">
                      <span class="meta">${esc(n.message_type)} · ${fmtTime(n.created_at)}</span>
                    </div>
                    <div class="row-sub" style="max-width:100%;white-space:normal">${esc(previewText(n))}</div>
                    ${n.error ? `<div class="meta" style="margin-top:6px;color:var(--failed)">${esc(n.error)}</div>` : ""}
                  </div>
                  ${badgeHtml(n.status)}
                </div>
              </li>`).join("")}
            </ul>`;
          $("drawer-write")?.addEventListener("click", () => {
            closeDrawer();
            goSend(phone);
          });
        } catch (e) {
          if (e instanceof AuthError || e?.name === "AuthError") return;
          $("drawer-body").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
        }
      }

      function closeDrawer() {
        drawer.classList.remove("open");
        drawerBackdrop.classList.remove("open");
        drawer.setAttribute("aria-hidden", "true");
      }

      $("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = $("login-username").value.trim();
        const password = $("login-password").value;
        $("login-err").textContent = "";
        $("login-btn").disabled = true;
        try {
          const data = await api("/auth/token", {
            method: "POST",
            skipAuth: true,
            body: JSON.stringify({ username, password }),
          });
          setAuth(data.access_token, username);
          showApp(true);
        } catch (err) {
          $("login-err").textContent = err.message || "Невірні дані";
        } finally {
          $("login-btn").disabled = false;
        }
      });

      $("btn-logout").addEventListener("click", () => {
        forceLogout();
      });

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => switchTab(tab.dataset.tab));
      });

      $("btn-filter").addEventListener("click", () => {
        state.filters = collectFilters();
        state.page = 1;
        loadList();
      });
      $("btn-filter-reset").addEventListener("click", () => {
        $("f-status").value = "";
        $("f-phone").value = "";
        $("f-date").value = "";
        $("f-hour").value = "";
        state.filters = {};
        state.page = 1;
        loadList();
      });
      $("btn-prev").addEventListener("click", () => {
        if (state.page > 1) { state.page -= 1; loadList(); }
      });
      $("btn-next").addEventListener("click", () => {
        state.page += 1;
        loadList();
      });

      $("drawer-close").addEventListener("click", closeDrawer);
      drawerBackdrop.addEventListener("click", closeDrawer);

      function clearBulkFile() {
        state.bulkFile = null;
        state.bulkTotal = null;
        $("send-file").value = "";
        $("file-chip").classList.add("hidden");
        $("send-phone").classList.remove("hidden");
        $("send-phone").required = true;
      }

      function showFileChip(file, meta) {
        const ext = (file.name.split(".").pop() || "FILE").toUpperCase().slice(0, 4);
        $("file-chip-ext").textContent = ext;
        $("file-chip-name").textContent = file.name;
        $("file-chip-meta").textContent = meta;
        $("send-phone").classList.add("hidden");
        $("send-phone").required = false;
        $("send-phone").value = "";
        $("file-chip").classList.remove("hidden");
      }

      $("btn-import-help").addEventListener("click", () => {
        openModal({
          title: "Імпорт номерів",
          bodyHtml: `
            <p>Завантажте файл зі списком телефонів для <strong>групової розсилки</strong>.</p>
            <ul>
              <li><strong>Формати:</strong> <code>.csv</code>, <code>.xlsx</code>, <code>.txt</code></li>
              <li><strong>Ліміт:</strong> до 500 номерів у одному файлі</li>
              <li><strong>Стовпчик:</strong> назвіть <code>phone</code> / <code>телефон</code> або просто перелік номерів у будь-яких клітинках</li>
              <li><strong>Формат номера:</strong> UA, нормалізується до <code>+380…</code> (напр. <code>067…</code>, <code>380…</code>)</li>
              <li>Дублікати прибираються; невалідні рядки пропускаються</li>
              <li>Один текст іде на всі номери; у історії — одна <strong>Групова розсилка</strong> (сесія), яку можна розгорнути</li>
            </ul>`,
        });
      });

      $("btn-import").addEventListener("click", () => $("send-file").click());
      $("btn-file-clear").addEventListener("click", clearBulkFile);

      $("send-file").addEventListener("change", async () => {
        const file = $("send-file").files?.[0] || null;
        if (!file) {
          clearBulkFile();
          return;
        }
        state.bulkFile = file;
        showFileChip(file, "Перевірка номерів…");
        $("send-err").textContent = "";
        try {
          const fd = new FormData();
          fd.append("file", file);
          const preview = await api("/notifications/parse-phones", { method: "POST", body: fd });
          state.bulkTotal = preview.total;
          let meta = `${preview.total} номерів знайдено`;
          if (preview.invalid_count) meta += ` · пропущено ${preview.invalid_count}`;
          showFileChip(file, meta);
        } catch (err) {
          if (err instanceof AuthError || err?.name === "AuthError") return;
          clearBulkFile();
          $("send-err").textContent = err.message;
          showToast(err.message, "bad");
        }
      });

      $("send-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        $("send-err").textContent = "";
        $("send-result").classList.add("hidden");
        $("send-btn").disabled = true;
        const text = $("send-text").value;
        try {
          if (state.bulkFile) {
            const fd = new FormData();
            fd.append("text", text);
            fd.append("file", state.bulkFile);
            const result = await api("/notifications/send-bulk", { method: "POST", body: fd });
            $("send-result").classList.remove("hidden");
            $("send-result").innerHTML = `
              <div class="detail-grid">
                <strong>Розсилку запущено</strong>
                <div class="kv"><span>Номерів</span><div>${esc(result.total)}</div></div>
                <div class="kv"><span>Campaign</span><div class="meta">${esc(result.campaign_id)}</div></div>
                ${result.invalid_count ? `<div class="kv"><span>Пропущено</span><div>${esc(result.invalid_count)}</div></div>` : ""}
              </div>`;
            showToast(`Розсилка: ${result.total} номерів`, "ok");
            clearBulkFile();
            $("send-text").value = "";
          } else {
            const phone = $("send-phone").value.trim();
            if (!phone) throw new Error("Вкажіть телефон або імпортуйте файл");
            const notif = await api("/notifications/send", {
              method: "POST",
              body: JSON.stringify({ phone, text }),
            });
            $("send-result").classList.remove("hidden");
            $("send-result").innerHTML = `
              <div class="detail-grid">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
                  <strong>${esc(notif.phone)}</strong>
                  ${badgeHtml(notif.status)}
                </div>
                <div class="kv"><span>Текст</span><pre>${esc(notif.payload?.text || "")}</pre></div>
                ${notif.error ? `<div class="kv"><span>Помилка</span><pre>${esc(notif.error)}</pre></div>` : ""}
              </div>`;
            showToast(
              notif.status === "sent" ? "Повідомлення надіслано" : `Статус: ${STATUS[notif.status]?.label || notif.status}`,
              notif.status === "sent" ? "ok" : (notif.status === "failed" ? "bad" : "")
            );
            if (notif.status === "sent") $("send-text").value = "";
          }
        } catch (err) {
          if (err instanceof AuthError || err?.name === "AuthError") return;
          $("send-err").textContent = err.message;
          showToast(err.message, "bad");
        } finally {
          $("send-btn").disabled = false;
        }
      });

      if (token() && !isTokenUnusable(token())) showApp(true);
      else {
        if (token()) clearAuth();
        showApp(false);
      }
    })();
  </script>
</body>
</html>
